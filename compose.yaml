services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: legal-ai-app:latest
    container_name: legal-ai-app
    ports:
      - "8000:8000"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4.1-flash}
      DATA_DIR: /app/data
    restart: unless-stopped
